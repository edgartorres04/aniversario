<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feliz Aniversario ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #e75480;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .corazon {
      font-size: 45px;
      animation: latido 1s infinite;
    }

    @keyframes latido {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    .mensaje {
      font-size: 17px;
      color: #555;
      line-height: 1.6;
      margin: 20px 0;
    }

    .contador-titulo {
      font-size: 18px;
      color: #e75480;
      font-weight: bold;
      margin-top: 20px;
    }

    #contador {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin: 15px 0 25px;
      line-height: 1.5;
    }

    .foto {
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      margin: 10px auto 20px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .spotify {
      display: inline-block;
      background: #1DB954;
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(29,185,84,0.4);
      transition: 0.3s;
    }

    .spotify:hover {
      transform: scale(1.05);
    }

    .final {
      margin-top: 25px;
      color: #e75480;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="corazon">❤️</div>

    <h1>Feliz Aniversario Mi princesa ❤️</h1>

    <p class="mensaje">
      Cada momento contigo se ha convertido en uno de mis recuerdos favoritos.
      Gracias por estar conmigo, por hacerme feliz y por compartir tu vida conmigo.
      ❤️
    </p>

    <div class="contador-titulo">
      Falta para nuestro aniversario ❤️
    </div>

    <div id="contador"></div>

    <!-- FOTO DE USTEDES -->
    <img src="IMG_5538.jpeg" class="foto" alt="Nuestra foto ❤️">

    <!-- BOTÓN DE SPOTIFY -->
    <a 
      class="spotify"
      href="https://open.spotify.com/track/1zUsPIUw73Ga0TrDbTH5md?si=laf4bCFpQNqQy-7d_C3K6A&utm_source=copy-link"
      target="_blank"
    >
      🎵 Nuestra Canción
    </a>

    <p class="final">
      Te amo mucho ❤️
    </p>

  </div>


  <script>

    const fechaAniversario = new Date("September 6, 2026 00:00:00").getTime();

    const contador = setInterval(function() {

      const ahora = new Date().getTime();

      const diferencia = fechaAniversario - ahora;

      if (diferencia <= 0) {

        document.getElementById("contador").innerHTML =
          "❤️ ¡Hoy cumplimos nuestro aniversario! ❤️";

        clearInterval(contador);

        return;
      }

      const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));

      const horas = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutos = Math.floor(
        (diferencia % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const segundos = Math.floor(
        (diferencia % (1000 * 60)) /
        1000
      );

      document.getElementById("contador").innerHTML =
        dias + " días " +
        horas + " horas " +
        minutos + " minutos " +
        segundos + " segundos ❤️";

    }, 1000);

  </script>

</body>
</html>
